server:
  servlet:
    context-path: /url

spring:
  application:
    name: url

  datasource:
    hikari:
      jdbc-url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      driver-class-name: org.h2.Driver
      username: sa
      maximum-pool-size: 100
      minimum-idle: 20
      connection-timeout: 3000

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: localhost
      port: 16379


logging:
  level:
    root: INFO
  file:
    name: logs/app.log
